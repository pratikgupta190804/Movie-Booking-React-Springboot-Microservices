spring:
  application:
    name: theatre-service

  datasource:
    url: jdbc:postgresql://localhost:5432/theatre-db
    username: postgres
    password: Pratik@321
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/movie-booking-app
          jwk-set-uri: http://localhost:8181/realms/movie-booking-app/protocol/openid-connect/certs

server:
  port: 8083

#eureka:
