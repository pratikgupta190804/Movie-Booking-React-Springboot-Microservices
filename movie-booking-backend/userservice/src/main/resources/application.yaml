spring:
  application:
    name: user-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/user-db

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/movie-booking-app

  config:
    import: optional:configserver:http://localhost:8888
    enabled: false


#eureka:
#  client:
#    serviceUrl:
#      defaultZone: http://localhost:8761/eureka/
#  instance:
#    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    mongodb:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

keycloak:
  server-url: http://localhost:8181
  realm: movie-booking-app
  client-id: movie-booking-client
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin-username: admin
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

server:
  port: 8081

