spring:
  application:
    name: api-gateway

  # ── JWT Validation ─────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/movie-booking-app
          jwk-set-uri: http://localhost:8181/realms/movie-booking-app/protocol/openid-connect/certs

  # ── Routes ─────────────────────────────────────────────────────────
  cloud:
    gateway:
      # Global CORS — applies to all routes
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

      # Default filters applied to every route
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      routes:
        # ── User Service ─────────────────────────────────────────────
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        # ── Movie Service ────────────────────────────────────────────
        - id: movie-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/movies/**
          filters:
            - StripPrefix=0

        # ── Theatre Service ──────────────────────────────────────────
        - id: theatre-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/theatres/**,/api/screens/**
          filters:
            - StripPrefix=0

        # ── Show Service ─────────────────────────────────────────────
        - id: show-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/shows/**
          filters:
            - StripPrefix=0

        # ── Inventory Service ────────────────────────────────────────
        - id: inventory-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/inventory/**,/api/seats/**
          filters:
            - StripPrefix=0

        # ── Booking Service ──────────────────────────────────────────
        - id: booking-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/bookings/**
          filters:
            - StripPrefix=0

        # ── Payment Service ──────────────────────────────────────────
        - id: payment-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=0

        # ── Ticket Service ───────────────────────────────────────────
        - id: ticket-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/tickets/**
          filters:
            - StripPrefix=0

server:
  port: 8080

# Disable Eureka
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    reactor.netty: DEBUG