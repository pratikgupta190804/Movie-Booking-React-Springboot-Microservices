management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.moviebooking.inventory: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    feign: DEBUG

# Feign Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

# Service URLs for OpenFeign clients
theatre-service:
  url: ${THEATRE_SERVICE_URL:http://localhost:8083}

show-service:
  url: ${SHOW_SERVICE_URL:http://localhost:8084}
